[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name             = "dj-tracks-dw"
version          = "2.1.0"
description      = "Multi-platform music downloader with a DJ-style GUI (Spotify / Apple Music / SoundCloud)"
readme           = "README.md"
requires-python  = ">=3.9"
license          = { text = "Personal use" }
authors          = [{ name = "thiba" }]
keywords         = ["music", "downloader", "spotify", "apple-music", "soundcloud", "yt-dlp"]
classifiers      = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "yt-dlp>=2024.1.1",
    "spotdl>=4.2.0",
    "spotipy>=2.23.0",
    "soundcloud-v2>=1.3.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "python-slugify>=8.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
dj-tracks = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "downloader*", "metadata*", "providers*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts         = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # long lines tolerated for UI strings / colour tuples
