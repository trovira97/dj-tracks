[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "dj-tracks"
version         = "2.2.0"
description     = "Music downloader for DJs — Spotify, Apple Music, SoundCloud, Bandcamp, YouTube + Beatport metadata"
readme          = "README.md"
requires-python = ">=3.10"
license         = { file = "LICENSE" }
authors         = [{ name = "Thibaud Rovira", email = "thibaudrovira1997@gmail.com" }]
urls            = { Homepage = "https://github.com/trovira97/dj-tracks", Issues = "https://github.com/trovira97/dj-tracks/issues" }
keywords        = ["music", "downloader", "dj", "beatport", "camelot", "spotify",
                   "apple-music", "soundcloud", "bandcamp", "youtube", "yt-dlp"]
classifiers     = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "yt-dlp>=2024.1.1",
    "spotdl>=4.2.0",
    "spotipy>=2.23.0",
    "soundcloud-v2>=1.3.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "python-slugify>=8.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5.0",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
dj-tracks = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "downloader*", "metadata*", "providers*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short"

# ── Linting / formatting ───────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"
extend-exclude = [".vendor", "build_temp", "dist", "final test", "backend/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PIE"]
ignore = [
    "E501",   # line length — UI strings + colour tuples breathe
    "B008",   # function-call-in-default-arg (used by FastAPI on purpose)
    "E702",   # statement-ends-with-semicolon (we use it for compact UI init)
    "SIM102", # nested ifs sometimes read clearer than combined and-chains
    "SIM108", # ternary not always more readable than if/else
    "SIM105", # `try/except/pass` is fine without contextlib.suppress
    "SIM113", # enumerate is overkill when index is incidental
    "B904",   # `raise ... from` not always desired (we lose context on purpose)
    "B017",   # broad assertRaises in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["B011"]               # asserts in tests are fine
"main.py"      = ["E402"]                # late imports are intentional
"backend/bot.py" = ["UP035"]             # discord.py's typing imports

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    \.vendor
  | build_temp
  | dist
  | final\ test
  | backend/\.venv
)/
'''

[tool.mypy]
python_version           = "3.10"
warn_unused_ignores      = true
warn_redundant_casts     = true
no_implicit_optional     = true
check_untyped_defs       = true
exclude                  = [".vendor", "build_temp", "dist", "final test", "backend/.venv"]

[tool.coverage.run]
branch       = true
source       = ["core", "downloader", "metadata", "providers", "ui", "utils"]
omit         = ["*/__pycache__/*", "*/.vendor/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
