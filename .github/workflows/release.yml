name: Release

# Triggers when a tag matching v*.*.* is pushed.  Builds the Windows
# bundle with PyInstaller, zips it, and attaches it to a fresh GitHub
# release.  No manual zipping / uploading.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write     # required to create the release + upload assets

jobs:
  build-windows:
    name: Build · Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Confirm version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $vfile = Select-String -Path __version__.py -Pattern '__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
          $ver = $vfile.Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            Write-Error "Tag $tag != __version__ $ver"
            exit 1
          }
          Write-Host "Tag and __version__ both at $ver"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build_temp build/dj_tracks.spec

      - name: Verify the .exe exists
        shell: pwsh
        run: |
          $exe = "dist/DJ Tracks/DJ Tracks.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not produced"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "EXE built: $exe ($size MB)"

      - name: Zip the bundle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist/DJ Tracks" -DestinationPath "dist/DJ Tracks $tag.zip" -CompressionLevel Optimal
          $size = [math]::Round((Get-Item "dist/DJ Tracks $tag.zip").Length / 1MB, 1)
          Write-Host "Zipped: $size MB"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # GitHub auto-generates release notes from PR titles since the
          # previous tag.  If you want hand-curated notes, supply
          # body_path: ./RELEASE_NOTES.md instead.
          generate_release_notes: true
          files: |
            dist/DJ Tracks ${{ github.ref_name }}.zip
