name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on a new push to the same branch — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Only install what tests actually need — keeps CI fast.
          python -m pip install pytest pytest-cov
          python -m pip install customtkinter Pillow yt-dlp mutagen requests python-slugify platformdirs spotipy soundcloud-v2

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -q --tb=short --cov=core --cov=utils --cov=providers --cov=metadata --cov=downloader --cov-report=term-missing

  lint:
    name: Lint · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --output-format=github
