# Auto-update dependencies weekly.  Dependabot opens a PR per dep when
# a newer version exists; CI runs against it, so risky updates surface
# in seconds.  https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Python dependencies (app + backend share requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps-backend)
    labels: [dependencies, backend]
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions themselves (actions/checkout, setup-python, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(actions)
    labels: [dependencies, ci]
